<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>OneDrop - Pro Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --primary: #6366f1;
      --accent: #d946ef;
      --bg-dark: #050508;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-glass: rgba(10, 10, 15, 0.8);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --radius-lg: 24px;
      --radius-md: 16px;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(217, 70, 239, 0.1) 0%, transparent 40%);
    }

    #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0.3; }

    header {
      position: fixed; top: 0; width: 100%; height: 70px;
      background: var(--bg-glass); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5%;
    }

    .brand { font-weight: 900; font-size: 1.6rem; cursor: pointer; font-family: 'Space Grotesk'; }
    .brand span { color: var(--primary); }

    .wallet-pill {
      background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px; font-weight: 600;
    }

    .hero { margin: 100px 5% 30px; }
    .hero h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-family: 'Space Grotesk'; line-height: 1.1; }
    .text-gradient { background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 0 5% 100px; }

    .card {
      background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.05);
      overflow: hidden; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative;
    }
    .card:hover { transform: translateY(-8px); border-color: var(--primary); }
    .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .card-body { padding: 20px; }
    .price-tag { font-size: 1.4rem; font-weight: 800; color: var(--accent); margin-top: 5px; }
    
    .badge {
        position: absolute; top: 15px; right: 15px; padding: 5px 12px; border-radius: 50px;
        font-size: 0.7rem; font-weight: 700; text-transform: uppercase; backdrop-filter: blur(5px);
    }
    .badge-hype { background: rgba(217, 70, 239, 0.2); color: var(--accent); border: 1px solid var(--accent); }

    .fab {
      position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
      background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center;
      z-index: 150; cursor: pointer; transition: 0.3s; color: white; font-size: 1.5rem;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }
    .fab:hover { transform: scale(1.1); background: var(--accent); }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
      z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      width: 100%; max-width: 500px; background: #0c0c12; border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg); padding: 25px; max-height: 90vh; overflow-y: auto;
    }

    .btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700;
      cursor: pointer; transition: 0.2s; font-family: inherit; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-ghost { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-muted); }
    .form-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; color: white; font-family: inherit; }
    
    .upload-area {
      border: 2px dashed rgba(255,255,255,0.1); border-radius: 15px; padding: 30px; text-align: center;
      cursor: pointer; margin-bottom: 15px;
    }
    #preview-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; display: none; margin-bottom: 15px; }

    .ai-box {
      border-radius: 15px; padding: 15px; margin: 15px 0; font-size: 0.9rem;
      transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03);
    }
    .ai-box.good { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
    .ai-box.bad { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .ai-box.neutral { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    .ai-badge { font-size: 0.65rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 5px; opacity: 0.8; }

    #toast-wrap { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 1000; pointer-events: none; }
    .toast { background: #1a1a25; border: 1px solid #333; padding: 12px 24px; border-radius: 50px; color: white; margin-bottom: 10px; }

    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .ai-sparkle { color: var(--accent); margin-right: 5px; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div id="toast-wrap"></div>

  <header>
    <div class="brand"><span>One</span>Drop <i class="fas fa-bolt" style="color:var(--accent)"></i></div>
    <div class="wallet-pill">
      <i class="fas fa-wallet" style="color: var(--success);"></i>
      <span id="balance">€1.500,00</span>
    </div>
  </header>

  <div class="hero">
    <h1>Premium Drops.<br><span class="text-gradient">KI-Verifiziert.</span></h1>
    <p style="color:var(--text-muted); margin-top:10px;">Exklusiver Marktplatz für hochwertige Produkte mit Echtzeit-Preisanalyse.</p>
  </div>

  <main class="grid" id="main-grid"></main>

  <div class="fab" onclick="openUploadModal()"><i class="fas fa-plus"></i></div>

  <!-- Detail Modal -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <div id="modal-body"></div>
      <button class="btn btn-ghost" onclick="closeModals()">Schließen</button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="upload-modal">
    <div class="modal-content">
      <h2 style="margin-bottom:20px; font-family:'Space Grotesk'">Neues Angebot erstellen</h2>
      
      <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <i class="fas fa-cloud-upload-alt" style="font-size: 2rem; color: var(--primary)"></i>
        <p style="margin-top:10px">Produktbild hochladen</p>
        <input type="file" id="file-input" hidden accept="image/*" onchange="handleFile(this)">
      </div>
      <img id="preview-img">

      <div class="form-group">
        <label>Produktbezeichnung</label>
        <input type="text" id="up-name" class="form-input" placeholder="Titel eingeben..." onblur="generateAutoContent()">
      </div>
      
      <div id="upload-status"></div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="form-group">
          <label>Startpreis (€)</label>
          <input type="number" id="up-start" class="form-input" placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Mindestpreis (€)</label>
          <input type="number" id="up-min" class="form-input" placeholder="0.00">
        </div>
      </div>

      <div class="form-group">
        <label>KI-Beschreibung</label>
        <textarea id="up-desc" class="form-input" style="height:80px; resize:none;" placeholder="Wird automatisch generiert..."></textarea>
      </div>
      
      <button class="btn btn-primary" id="btn-create" onclick="createDrop()">
        ✨ SMART-DROP VERÖFFENTLICHEN
      </button>
      <button class="btn btn-ghost" onclick="closeModals()">Abbrechen</button>
    </div>
  </div>

  <script>
    const apiKey = ""; 
    const state = {
      balance: 1500,
      products: [
        { id: 1, name: "Jordan 1 Low x Travis Scott", img: "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500", desc: "Klassischer Sneaker in Kollaboration mit Travis Scott.", start: 1200, min: 800, step: 2, interval: 10, startTime: Date.now(), cat: "Sneaker", badge: "Investment" },
        { id: 2, name: "iPhone 15 Pro Max Titanium", img: "https://images.unsplash.com/photo-1696446701796-da61225697cc?w=500", desc: "Apples aktuelles Flaggschiff in der Titanium Edition.", start: 1100, min: 750, step: 5, interval: 30, startTime: Date.now() - 60000, cat: "Tech", badge: "Daily Deal" }
      ],
      tempImage: null
    };

    // --- GEMINI CORE ---
    async function callGemini(prompt, isJson = false) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: "Du bist ein professioneller E-Commerce Experte und Markt-Analyst. Antworte in klarem, sachlichem Deutsch ohne Jugendsprache." }] }
      };
      if(isJson) {
        payload.generationConfig = { responseMimeType: "application/json" };
      }

      try {
        const res = await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        return isJson ? JSON.parse(text) : text;
      } catch (e) { 
        console.error("Gemini Error:", e);
        return isJson ? null : "Dienst momentan nicht verfügbar."; 
      }
    }

    async function analyzeImageUpload(base64Data, title) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      const prompt = `Analysiere dieses Produktbild und den Titel "${title}". Erstelle ein JSON mit: 
      { "suggestedStart": zahl, "suggestedMin": zahl, "description": "kurze profi-beschreibung", "category": "Kategorie", "suggestedBadge": "Kurzer Badge (max 10 Zeichen)" }`;
      
      const payload = {
        contents: [{
          parts: [
            { text: prompt },
            { inlineData: { mimeType: "image/png", data: base64Data.split(',')[1] } }
          ]
        }],
        generationConfig: { responseMimeType: "application/json" }
      };

      try {
        const res = await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        return JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text);
      } catch (e) { return null; }
    }

    // --- UI RENDER ---
    function renderGrid() {
      const grid = document.getElementById('main-grid');
      grid.innerHTML = state.products.map(p => {
        const d = calculatePrice(p);
        return `
          <div class="card" onclick="openDetail(${p.id})">
            ${p.badge ? `<div class="badge badge-hype">${p.badge}</div>` : ''}
            <img src="${p.img}" class="card-img">
            <div class="card-body">
              <p style="font-size:0.7rem; color:var(--text-muted)">${p.cat || 'EXKLUSIV'}</p>
              <h3 style="margin-top:2px;">${p.name}</h3>
              <div class="price-tag" id="price-${p.id}">€${d.price}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function calculatePrice(p) {
      const elapsed = (Date.now() - p.startTime) / 1000;
      const drops = Math.floor(elapsed / p.interval);
      let price = p.start - (drops * (p.step || 2));
      if (price < p.min) price = p.min;
      return { price: price.toFixed(2) };
    }

    async function openDetail(id) {
      const p = state.products.find(x => x.id === id);
      const modal = document.getElementById('detail-modal');
      const body = document.getElementById('modal-body');
      const d = calculatePrice(p);

      body.innerHTML = `
        <img src="${p.img}" style="width:100%; border-radius:15px; margin-bottom:15px;">
        <h2>${p.name}</h2>
        <p style="color:var(--text-muted); margin:10px 0; font-size:0.9rem;">${p.desc || ''}</p>
        <div class="price-tag" style="font-size:2rem; margin:10px 0;">€${d.price}</div>
        <div id="ai-box-detail" class="ai-box">
          <div class="ai-badge">✨ KI MARKT-BERATER</div>
          <div id="ai-info-detail"><i class="fas fa-circle-notch spinner"></i> Analysiere Marktwert und Trend...</div>
        </div>
        <button class="btn btn-primary" onclick="buyItem(${p.id})">JETZT KAUFEN</button>
      `;
      modal.classList.add('active');
      
      const prompt = `Analysiere den Preis von ${d.price}€ für "${p.name}". Ist das ein guter Deal oder zu teuer? 
      Antworte im JSON Format: { "status": "GUT" | "TEUER" | "NEUTRAL", "text": "Sachliche Begründung (2 Sätze)" }`;
      
      const analysis = await callGemini(prompt, true);
      
      const box = document.getElementById('ai-box-detail');
      const info = document.getElementById('ai-info-detail');
      
      if(analysis) {
          box.className = `ai-box ${analysis.status.toLowerCase() === 'gut' ? 'good' : analysis.status.toLowerCase() === 'teuer' ? 'bad' : 'neutral'}`;
          info.innerText = analysis.text;
      } else {
          info.innerText = "Marktanalyse momentan nicht verfügbar.";
      }
    }

    // --- UPLOAD ACTIONS ---
    function openUploadModal() {
      document.getElementById('upload-modal').classList.add('active');
    }

    function handleFile(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        state.tempImage = e.target.result;
        const prev = document.getElementById('preview-img');
        prev.src = state.tempImage;
        prev.style.display = 'block';
        generateAutoContent();
      };
      reader.readAsDataURL(file);
    }

    async function generateAutoContent() {
      const name = document.getElementById('up-name').value;
      if(!state.tempImage || !name) return;

      document.getElementById('upload-status').innerHTML = '<div class="ai-box"><i class="fas fa-magic spinner"></i> ✨ KI optimiert Ihr Listing...</div>';
      
      const data = await analyzeImageUpload(state.tempImage, name);
      if(data) {
        document.getElementById('up-start').value = data.suggestedStart;
        document.getElementById('up-min').value = data.suggestedMin;
        document.getElementById('up-desc').value = data.description;
        state.currentSuggestedBadge = data.suggestedBadge;
        document.getElementById('upload-status').innerHTML = `<div class="ai-box good"><div class="ai-badge">✨ KI OPTIMIERT</div>Preise, Kategorie (${data.category}) und Beschreibung wurden basierend auf Marktdaten angepasst.</div>`;
      }
    }

    function createDrop() {
      const name = document.getElementById('up-name').value;
      const start = parseFloat(document.getElementById('up-start').value);
      const min = parseFloat(document.getElementById('up-min').value);
      const desc = document.getElementById('up-desc').value;
      
      if (!name || !start || !state.tempImage) {
        showToast("Bitte alle Pflichtfelder ausfüllen.", "error");
        return;
      }

      state.products.unshift({
        id: Date.now(),
        name,
        img: state.tempImage,
        desc,
        start,
        min: min || start * 0.8,
        step: Math.ceil(start * 0.005),
        interval: 20,
        startTime: Date.now(),
        cat: "User Angebot",
        badge: state.currentSuggestedBadge || "NEU"
      });

      showToast("Angebot erfolgreich veröffentlicht.", "success");
      closeModals();
      renderGrid();
    }

    function buyItem(id) {
      const p = state.products.find(x => x.id === id);
      const d = calculatePrice(p);
      const price = parseFloat(d.price);

      if (state.balance >= price) {
        state.balance -= price;
        document.getElementById('balance').innerText = `€${state.balance.toLocaleString('de-DE', {minimumFractionDigits: 2})}`;
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        showToast("Kauf erfolgreich abgeschlossen.", "success");
        state.products = state.products.filter(x => x.id !== id);
        closeModals();
        renderGrid();
      } else {
        showToast("Guthaben nicht ausreichend.", "error");
      }
    }

    function closeModals() {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }

    function showToast(msg, type) {
      const wrap = document.getElementById('toast-wrap');
      const t = document.createElement('div');
      t.className = 'toast';
      t.style.borderLeft = `4px solid ${type === 'success' ? 'var(--success)' : 'var(--danger)'}`;
      t.innerText = msg;
      wrap.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // Background Canvas
    function initCanvas() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
      window.onresize = resize; resize();
      for(let i=0; i<30; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
      function loop() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(99, 102, 241, 0.2)';
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if(p.x<0) p.x=canvas.width; if(p.x>canvas.width) p.x=0;
          if(p.y<0) p.y=canvas.height; if(p.y>canvas.height) p.y=0;
          ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(loop);
      }
      loop();
    }

    window.onload = () => {
      initCanvas();
      renderGrid();
      setInterval(() => {
        state.products.forEach(p => {
          const d = calculatePrice(p);
          const el = document.getElementById(`price-${p.id}`);
          if(el) el.innerText = `€${d.price}`;
        });
      }, 1000);
    };
  </script>
</body>
</html>
